name: Read-only draft release verification
on:
  push:
    branches: [codex/fix-draft-release-039]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - run: node --test publisher/*.test.mjs
      - name: Verify draft access with a read-only token and no signing key
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node publisher/check-draft-access.mjs
